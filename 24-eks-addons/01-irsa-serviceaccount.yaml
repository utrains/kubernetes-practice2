# A ServiceAccount annotated for IRSA + a Pod using it.
#
# Prereqs (run before applying this file):
#   eksctl utils associate-iam-oidc-provider --cluster <name> --approve
#   eksctl create iamserviceaccount \
#     --cluster <name> --namespace default --name s3-reader-sa \
#     --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess --approve
#
# The eksctl command above creates the ServiceAccount automatically with the
# right annotation. This manifest shows what the annotated ServiceAccount looks
# like so you can hand-write one if you are not using eksctl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader-sa
  namespace: default
  annotations:
    # Replace <account-id> and <role-name> with your real values.
    # eksctl fills this in for you.
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
---
apiVersion: v1
kind: Pod
metadata:
  name: s3-reader
  namespace: default
spec:
  serviceAccountName: s3-reader-sa    # The Pod inherits the ServiceAccount's IAM permissions.
  containers:
    - name: aws-cli
      image: amazon/aws-cli:latest
      command: ["sleep", "3600"]
      # Inside this Pod:
      #   aws s3 ls   ==> uses the IAM role, no access keys anywhere.
